<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Tiny Worlds VR</title>
  <link rel="stylesheet" href="css/style.css?v=2.13">
</head>
<body>
  <canvas id="scene"></canvas>

  <!-- barra superior durante la partida en pantalla -->
  <div id="hud" class="hidden">
    <div class="pill" id="progress">0 / 0</div>
    <div class="pill" id="timer">00:00</div>
    <div class="pill hidden" id="fps">– fps</div>
    <div class="spacer"></div>
    <button class="icon" id="btn-ref" title="Miniatura de referencia" aria-label="Miniatura de referencia"></button>
    <button class="icon" id="btn-shuffle" title="Reordenar las piezas sueltas" aria-label="Reordenar las piezas sueltas"></button>
    <button class="icon hidden" id="btn-prev" title="Modelo anterior" aria-label="Modelo anterior"></button>
    <button class="icon hidden" id="btn-next" title="Modelo siguiente" aria-label="Modelo siguiente"></button>
    <button class="icon hidden" id="btn-shrink" title="Achicar el modelo" aria-label="Achicar el modelo"></button>
    <button class="icon hidden" id="btn-size1" title="Tamaño y lugar originales" aria-label="Tamaño y lugar originales"></button>
    <button class="icon hidden" id="btn-grow" title="Agrandar el modelo" aria-label="Agrandar el modelo"></button>
    <button class="icon hidden" id="btn-spin" title="Girar o detener" aria-label="Girar o detener"></button>
    <button class="icon hidden" id="btn-time" title="Hora del día" aria-label="Hora del día"></button>
    <button class="icon" id="btn-sound" title="Sonido" aria-label="Sonido"></button>
    <button class="icon accent hidden" id="btn-vr" title="Entrar en realidad virtual" aria-label="Entrar en realidad virtual"></button>
    <button class="icon accent hidden" id="btn-ar" title="Entrar en realidad mixta" aria-label="Entrar en realidad mixta"></button>
    <button class="icon" id="btn-menu" title="Menú" aria-label="Menú"></button>
  </div>
  <div id="hint" class="hidden"></div>

  <div id="menu" class="overlay">
    <div class="card">
      <header class="brand">
        <span class="logo" data-icon="cube" data-size="26"></span>
        <div class="brand-text">
          <h1>Tiny Worlds VR</h1>
          <p class="sub">Piece by Piece</p>
        </div>
        <span class="chip" id="version">v2.13</span>
      </header>

      <section>
        <h2>Elige un rompecabezas</h2>
        <div id="puzzle-grid" class="grid"></div>
        <p class="note" id="puzzle-note"></p>
      </section>

      <section class="pair">
        <div>
          <h2>Piezas</h2>
          <div class="seg" id="seg-count">
            <button data-v="25">25</button>
            <button data-v="50" class="on">50</button>
            <button data-v="100">100</button>
          </div>
        </div>
        <div>
          <h2>Modo</h2>
          <div class="seg" id="seg-mode">
            <button data-v="relax" class="on">Relajado</button>
            <button data-v="classic">Clásico</button>
          </div>
        </div>
      </section>
      <p class="note" id="mode-note"></p>

      <section id="where-box" class="hidden">
        <h2>Dónde jugar</h2>
        <div class="seg" id="seg-where">
          <button data-v="vr" class="on" data-icon="vr">Virtual</button>
          <button data-v="mixed" data-icon="room">Mixta</button>
          <button data-v="screen" data-icon="screen">Pantalla</button>
        </div>
      </section>

      <div class="actions">
        <button id="btn-start" class="accent big"><span id="start-label">Nueva partida</span></button>
        <button id="btn-continue" class="big hidden"><span>Continuar</span><small id="continue-detail"></small></button>
      </div>
      <button id="btn-inspect" class="big ghost" data-icon="explore">Explorar el modelo armado</button>
      <p class="note" id="vr-note"></p>

      <details class="settings">
        <summary data-icon="sliders">Ajustes</summary>
        <label class="check"><input type="checkbox" id="opt-music"> Música de fondo</label>
        <label class="check"><input type="checkbox" id="opt-daynight"> Ciclo de día y noche</label>
        <label class="check"><input type="checkbox" id="opt-env"> Entorno detallado (pradera y montañas; más exigente)</label>
        <label class="check"><input type="checkbox" id="opt-timer"> Mostrar el tiempo</label>
        <label class="check"><input type="checkbox" id="opt-fps"> Mostrar cuadros por segundo</label>
      </details>
    </div>
  </div>

  <div id="done" class="overlay hidden">
    <div class="card small">
      <h1>¡Completado!</h1>
      <p class="sub" id="done-text"></p>
      <div class="actions">
        <button id="btn-admire" class="big">Contemplar</button>
        <button id="btn-again" class="accent big">Jugar de nuevo</button>
      </div>
    </div>
  </div>

  <script type="importmap">{ "imports": { "three": "./js/vendor/three.module.js" } }</script>
  <script type="module" src="js/main.js?v=2.13"></script>
</body>
</html>
